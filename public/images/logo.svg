<svg width="290" height="56" viewBox="0 0 290 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ChatGPT Icon Glow -->
    <filter id="chatgpt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10a37f" flood-opacity="0.35" />
    </filter>
    <linearGradient id="badge-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
